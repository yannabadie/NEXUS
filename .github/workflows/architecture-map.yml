# NEXUS Architecture Map Generator - CI/CD
#
# Automatically regenerates the architecture documentation on push.
# Commits the updated map back to the repository if changes detected.
#
# V8.3.1: Initial setup

name: Architecture Map

on:
  push:
    branches: [N8THM, N7HM, main]
    paths:
      # Trigger on changes to core code
      - 'core/**/*.py'
      - 'scripts/generate_architecture_map.py'
      # Don't trigger on doc-only changes (avoid infinite loop)
      - '!docs/ARCHITECTURE_MAP_GENERATED.md'

  # Allow manual trigger
  workflow_dispatch:

# Prevent concurrent runs on same branch
concurrency:
  group: architecture-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-map:
    runs-on: ubuntu-latest

    # Don't run on commits from this workflow (avoid infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip-map]') && !contains(github.event.head_commit.message, 'Auto-update architecture map')"

    permissions:
      contents: write  # Required to push changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history for accurate git info
          fetch-depth: 0
          # Use token with write permissions
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          # Only install what's needed for the script (it uses stdlib mostly)
          pip install python-dotenv

      - name: Generate architecture map
        run: |
          python scripts/generate_architecture_map.py --output docs/ARCHITECTURE_MAP_GENERATED.md
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet docs/ARCHITECTURE_MAP_GENERATED.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in architecture map"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in architecture map"
            git diff --stat docs/ARCHITECTURE_MAP_GENERATED.md
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/ARCHITECTURE_MAP_GENERATED.md

          git commit -m "docs: Auto-update architecture map [skip-map]

          Auto-generated by GitHub Actions after code changes.

          Changes detected in core/ modules.

          🤖 Generated with NEXUS Architecture Map Generator"

          git push

      - name: Summary
        run: |
          echo "## Architecture Map Generation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "✅ Architecture map updated and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes detected - map is up to date" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Statistics" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          head -20 docs/ARCHITECTURE_MAP_GENERATED.md >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
