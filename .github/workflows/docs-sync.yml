# NEXUS Documentation Sync & Regression Check
#
# This workflow automatically generates and syncs documentation,
# detects issues, and prevents regression via CI/CD.

name: Documentation Sync & Regression Check

on:
  push:
    branches: [NX, N7HM, main]
  pull_request:
    branches: [NX, N7HM, main]
  schedule:
    # Run weekly on Monday at 6:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force regenerate all documentation'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  doc-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for change detection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 networkx
          # Install dev dependencies if they exist
          if [ -f requirements_dev.txt ]; then
            pip install -r requirements_dev.txt
          fi

      - name: Generate Documentation
        id: generate
        run: |
          echo "Generating documentation..."
          python -m tools.doc_generator generate \
            --all \
            --output-readmes \
            --output-mermaid docs/architecture/ \
            --detect-new \
            --verbose
          echo "generation_status=success" >> $GITHUB_OUTPUT

      - name: Run Audit
        id: audit
        run: |
          echo "Running audit..."
          python -m tools.doc_generator audit \
            --output audit/ \
            --json-output audit/issues.json

          # Count issues by severity
          if [ -f audit/issues.json ]; then
            CRITICAL=$(jq '[.[] | select(.severity == "critical")] | length' audit/issues.json)
            HIGH=$(jq '[.[] | select(.severity == "high")] | length' audit/issues.json)
            MEDIUM=$(jq '[.[] | select(.severity == "medium")] | length' audit/issues.json)
            LOW=$(jq '[.[] | select(.severity == "low")] | length' audit/issues.json)

            echo "critical_count=$CRITICAL" >> $GITHUB_OUTPUT
            echo "high_count=$HIGH" >> $GITHUB_OUTPUT
            echo "medium_count=$MEDIUM" >> $GITHUB_OUTPUT
            echo "low_count=$LOW" >> $GITHUB_OUTPUT
          fi

      - name: Check for Critical Issues
        id: check
        run: |
          echo "Checking for critical/high issues..."
          python -m tools.doc_generator check \
            --fail-on critical \
            --fail-on high || {
            echo "check_failed=true" >> $GITHUB_OUTPUT
            exit 1
          }
          echo "check_failed=false" >> $GITHUB_OUTPUT

      - name: Check Documentation Drift
        if: always()
        run: |
          echo "Checking documentation drift..."
          python -m tools.doc_generator drift --fail-if-outdated || true

      - name: Commit Documentation Updates
        if: github.event_name == 'push' && steps.check.outputs.check_failed != 'true'
        run: |
          git config user.name "NEXUS Doc Bot"
          git config user.email "bot@nexus.ai"

          # Add all documentation changes
          git add -A docs/ audit/ '*/README.md' || true

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No documentation changes to commit"
          else
            git commit -m "docs(auto): Sync documentation [skip ci]

          - Updated $(git diff --staged --name-only | wc -l) files
          - Generated by nexus-doc-generator

          🤖 Generated with [Claude Code](https://claude.com/claude-code)"

            git push
            echo "Documentation updates committed and pushed"
          fi

      - name: Comment PR with Audit Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let body = '## 📋 Documentation Audit\n\n';

            // Read issues if file exists
            try {
              const issues = JSON.parse(fs.readFileSync('audit/issues.json', 'utf8'));
              const critical = issues.filter(i => i.severity === 'critical');
              const high = issues.filter(i => i.severity === 'high');
              const medium = issues.filter(i => i.severity === 'medium');

              if (critical.length > 0) {
                body += `### ❌ ${critical.length} Critical Issues\n\n`;
                critical.slice(0, 5).forEach(i => {
                  body += `- \`${i.file}:${i.line}\`: ${i.message}\n`;
                });
                if (critical.length > 5) {
                  body += `- ... and ${critical.length - 5} more\n`;
                }
                body += '\n';
              }

              if (high.length > 0) {
                body += `### ⚠️ ${high.length} High Priority Issues\n\n`;
                high.slice(0, 5).forEach(i => {
                  body += `- \`${i.file}:${i.line}\`: ${i.message}\n`;
                });
                if (high.length > 5) {
                  body += `- ... and ${high.length - 5} more\n`;
                }
                body += '\n';
              }

              if (critical.length === 0 && high.length === 0) {
                body += '### ✅ No critical or high priority issues found\n\n';
              }

              body += `### 📊 Summary\n\n`;
              body += `| Severity | Count |\n`;
              body += `|----------|-------|\n`;
              body += `| Critical | ${critical.length} |\n`;
              body += `| High | ${high.length} |\n`;
              body += `| Medium | ${medium.length} |\n`;
              body += `| Total | ${issues.length} |\n`;

            } catch (e) {
              body += '### ⚠️ Could not read audit results\n\n';
              body += `Error: ${e.message}\n`;
            }

            body += '\n---\n*Auto-generated by nexus-doc-generator*';

            // Post comment
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Upload Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-audit
          path: |
            audit/
            docs/architecture/
          retention-days: 30

  # Separate job for scheduled comprehensive regeneration
  full-regenerate:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.force_regenerate == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 networkx

      - name: Full Documentation Regeneration
        run: |
          echo "Running full documentation regeneration..."
          python -m tools.doc_generator generate --all --verbose
          python -m tools.doc_generator audit --output audit/

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(auto): Weekly documentation sync"
          title: "📚 Weekly Documentation Sync"
          body: |
            ## Automated Documentation Update

            This PR contains automatically generated documentation updates from the weekly sync.

            ### Changes
            - Updated README files across all modules
            - Regenerated Mermaid diagrams
            - Refreshed audit reports

            ### Review Checklist
            - [ ] Verify generated documentation is accurate
            - [ ] Check Mermaid diagrams render correctly
            - [ ] Review any flagged issues in audit/

            ---
            *Auto-generated by nexus-doc-generator*
          branch: docs/weekly-sync
          delete-branch: true
