# NEXUS V12.4 COGNITIVE BOOST - CI/CD Pipeline
#
# 3 blocking quality gates:
#   1. unit-tests: pytest + coverage (Python 3.11, 3.12, 3.13)
#   2. lint-type-check: ruff + mypy
#   3. security-scan: bandit for OWASP compliance
#
# Additional jobs:
#   - integration: Manual trigger with real API keys
#   - torture: Nightly stress testing (3 AM UTC)

name: NEXUS CI

on:
  push:
    branches: [NX, NX-CG, main]
  pull_request:
    branches: [NX, NX-CG, main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}
  SKIP_LLM_TESTS: 1
  NEXUS_TELEMETRY: 0

jobs:
  # =========================================================================
  # Job 1: Unit Tests (BLOCKING)
  # =========================================================================
  unit-tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt
          pip install pytest-cov pytest-timeout

      - name: Create workspace directories
        run: |
          mkdir -p workspace/.nexus workspace/logs workspace/memory workspace/agents

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --tb=short -q \
            --timeout=60 \
            --ignore=tests/benchmark_professional.py \
            --cov=core \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=40
        timeout-minutes: 15

      - name: Upload coverage
        if: matrix.python-version == '3.13' && always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # =========================================================================
  # Job 2: Lint + Type Check (BLOCKING)
  # =========================================================================
  lint-type-check:
    name: Lint & Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt

      - name: Ruff lint
        run: |
          ruff check core/ tests/ nexus7.py --output-format=github
        continue-on-error: false

      - name: Ruff format check
        run: |
          ruff format --check core/ tests/ nexus7.py
        continue-on-error: true

      - name: Python syntax compilation
        run: |
          python -m py_compile nexus7.py
          python -m py_compile KERNEL.py
          find core -name "*.py" -exec python -m py_compile {} \;

      - name: Mypy type check (core modules)
        run: |
          mypy core/memory/types.py core/native/ core/security/password.py \
            --ignore-missing-imports --no-error-summary
        continue-on-error: true

  # =========================================================================
  # Job 3: Security Scan (BLOCKING)
  # =========================================================================
  security-scan:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: |
          bandit -r core/ -c pyproject.toml --format json --output bandit-report.json || true
          bandit -r core/ -c pyproject.toml --format screen -ll
        continue-on-error: true

      - name: KERNEL integrity check
        run: |
          python -c "
          import hashlib, sys
          content = open('KERNEL.py', 'rb').read()
          actual = hashlib.sha256(content).hexdigest()
          hash_file = open('KERNEL_HASH.txt').read().strip()
          expected = hash_file.split(':')[1] if ':' in hash_file else hash_file
          if actual != expected:
              print(f'KERNEL INTEGRITY FAILURE: {actual} != {expected}')
              sys.exit(1)
          print(f'KERNEL integrity OK: {actual[:16]}...')
          "

  # =========================================================================
  # Integration Tests (Manual trigger only)
  # =========================================================================
  integration:
    name: Integration (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [unit-tests, lint-type-check]

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        if: env.GEMINI_API_KEY != '' && env.ANTHROPIC_API_KEY != ''
        run: |
          python -m pytest tests/test_llm_context_isolation.py -v -s
        timeout-minutes: 60

  # =========================================================================
  # Torture Protocol (Nightly)
  # =========================================================================
  torture:
    name: Torture Protocol
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-asyncio

      - name: Create workspace
        run: mkdir -p workspace/.nexus/sagas workspace/logs workspace/memory

      - name: Run Torture Protocol
        run: |
          python -m pytest tests/torture_v8.py -m torture -v --tb=short
        timeout-minutes: 30
        continue-on-error: true

      - name: Generate report
        if: always()
        run: |
          echo "## Torture Protocol Results" >> $GITHUB_STEP_SUMMARY
          echo "- Target Success Rate: >95%" >> $GITHUB_STEP_SUMMARY
          echo "- Target Recovery Rate: >90%" >> $GITHUB_STEP_SUMMARY
          echo "- Target Panic Rate: <1%" >> $GITHUB_STEP_SUMMARY
