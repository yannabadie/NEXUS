# NEXUS V10 CEREBRO - Docker Compose
# Redis 7 for event bus pub/sub
#
# Usage:
#   docker-compose up -d redis    # Start Redis only
#   docker-compose down           # Stop all services
#   docker-compose logs redis     # View Redis logs

version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge

volumes:
  redis_data:
    name: nexus-redis-data
