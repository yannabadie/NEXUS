name: NEXUS CI

on:
  push:
    branches: [NX-CG]
  pull_request:
    branches: [NX-CG]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}
  SKIP_LLM_TESTS: "1"
  NEXUS_TELEMETRY: "0"

jobs:
  unit-tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling
          pip install -e ".[all]" 2>/dev/null || pip install -r requirements.txt

      - name: Create workspace directories
        run: mkdir -p workspace/.nexus workspace/logs workspace/memory workspace/agents

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --tb=short -q \
            --timeout=60 \
            --ignore=tests/benchmark_professional.py \
            --cov=core \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=60 \
            --junitxml=pytest-junit.xml
        timeout-minutes: 20

      - name: Upload unit test evidence
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-evidence
          path: |
            coverage.xml
            pytest-junit.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint-type-check:
    name: Lint & Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy hatchling
          pip install -e . 2>/dev/null || pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check core/ tests/ nexus7.py --output-format=github

      - name: Ruff format check
        run: ruff format --check core/ tests/ nexus7.py

      - name: Python syntax compilation
        run: |
          python -m py_compile nexus7.py
          find core -name "*.py" -exec python -m py_compile {} \;

      - name: Mypy type check
        run: mypy core/native/ --ignore-missing-imports --no-error-summary

  security-scan:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: |
          bandit -r core/ -c pyproject.toml --format json --output bandit-report.json
          bandit -r core/ -c pyproject.toml --format screen -ll

      - name: Upload security evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: bandit-report.json
          retention-days: 14

  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [unit-tests, lint-type-check, security-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-wheel
          path: dist/*.whl
          retention-days: 14

  install-smoke:
    name: Install smoke
    runs-on: ubuntu-latest
    needs: [build-wheel]
    env:
      PYTHONPATH: ""

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: built-wheel
          path: dist

      - name: Install wheel
        run: pip install dist/*.whl

      - name: Smoke installed entrypoints
        run: |
          nexus --version
          nexus-research --help
          python -c "from core.config import Config; print(Config().nexus_version)"

  interactive-bootstrap-smoke:
    name: Interactive bootstrap smoke
    runs-on: ubuntu-latest
    needs: [unit-tests, lint-type-check, security-scan]
    env:
      NEXUS_DRIVER_MODE: cli
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e ".[all]" 2>/dev/null || pip install -r requirements.txt

      - name: Install fake CLI providers
        run: |
          mkdir -p .ci-bin
          cat > .ci-bin/gemini <<'SH'
          #!/usr/bin/env sh
          if [ "$1" = "--version" ]; then
            echo "gemini-cli 1.0.0"
            exit 0
          fi
          if [ "$1" = "models" ]; then
            echo "gemini-3-pro-preview"
            exit 0
          fi
          echo "gemini-cli"
          SH
          cat > .ci-bin/claude <<'SH'
          #!/usr/bin/env sh
          echo "Claude Code 1.0.0"
          SH
          chmod +x .ci-bin/gemini .ci-bin/claude
          echo "${GITHUB_WORKSPACE}/.ci-bin" >> "$GITHUB_PATH"

      - name: Verify bootstrap path
        run: python nexus7.py --verify

  headless-smoke:
    name: Headless smoke
    runs-on: ubuntu-latest
    needs: [unit-tests, lint-type-check, security-scan]
    env:
      NEXUS_DRIVER_MODE: sdk
      ANTHROPIC_API_KEY: ci-smoke-key
      GOOGLE_API_KEY: ci-smoke-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e ".[all]" 2>/dev/null || pip install -r requirements.txt

      - name: Run strict headless contract
        run: |
          python nexus7.py --headless --output headless-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("headless-smoke.json").read_text(encoding="utf-8"))
          assert payload["status"] == "success", payload
          assert payload["driver"] == "anthropic_sdk", payload
          assert "error_code" in payload, payload
          assert "warnings" in payload, payload
          PY

      - name: Upload headless evidence
        uses: actions/upload-artifact@v4
        with:
          name: headless-evidence
          path: headless-smoke.json
          retention-days: 14

  evidence-ledger:
    name: Evidence ledger
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - lint-type-check
      - security-scan
      - build-wheel
      - install-smoke
      - interactive-bootstrap-smoke
      - headless-smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download evidence artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts

      - name: Generate evidence ledger
        run: |
          python scripts/generate_evidence_ledger.py \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --branch "${{ github.ref_name }}" \
            --sha "${{ github.sha }}" \
            --python-version "3.13" \
            --junit-xml "ci-artifacts/unit-test-evidence/pytest-junit.xml" \
            --coverage-xml "ci-artifacts/unit-test-evidence/coverage.xml" \
            --provider-registry "core/provider_registry.json" \
            --job-result "unit-tests=${{ needs.unit-tests.result }}" \
            --job-result "lint-type-check=${{ needs.lint-type-check.result }}" \
            --job-result "security-scan=${{ needs.security-scan.result }}" \
            --job-result "build-wheel=${{ needs.build-wheel.result }}" \
            --job-result "install-smoke=${{ needs.install-smoke.result }}" \
            --job-result "interactive-bootstrap-smoke=${{ needs.interactive-bootstrap-smoke.result }}" \
            --job-result "headless-smoke=${{ needs.headless-smoke.result }}" \
            --artifact "unit-test-evidence=ci-artifacts/unit-test-evidence" \
            --artifact "security-evidence=ci-artifacts/security-evidence" \
            --artifact "built-wheel=ci-artifacts/built-wheel" \
            --artifact "headless-evidence=ci-artifacts/headless-evidence" \
            --output-json "artifacts/evidence-ledger.json" \
            --output-markdown "artifacts/evidence-ledger.md"

      - name: Upload evidence ledger
        uses: actions/upload-artifact@v4
        with:
          name: evidence-ledger
          path: artifacts/evidence-ledger.*
          retention-days: 30

      - name: Append summary
        run: cat artifacts/evidence-ledger.md >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [evidence-ledger]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e ".[dev,sdk]" 2>/dev/null || pip install -r requirements.txt

      - name: Run integration tests
        if: env.GEMINI_API_KEY != '' && env.ANTHROPIC_API_KEY != ''
        run: python -m pytest tests/test_llm_context_isolation.py -v -s
        timeout-minutes: 60

  torture:
    name: Torture Protocol
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e ".[dev,sdk]" 2>/dev/null || pip install -r requirements.txt pytest-asyncio

      - name: Create workspace
        run: mkdir -p workspace/.nexus/sagas workspace/logs workspace/memory

      - name: Run Torture Protocol
        run: python -m pytest tests/torture_v8.py -m torture -v --tb=short
        timeout-minutes: 30

      - name: Generate report
        if: always()
        run: |
          echo "## Torture Protocol Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target Success Rate: >95%" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target Recovery Rate: >90%" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target Panic Rate: <1%" >> "$GITHUB_STEP_SUMMARY"
