version: '3.8'

services:
  nexus-redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexus-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nexus-core:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: nexus-core
    env_file:
      - .env
    volumes:
      - ./workspace:/app/workspace
      - ./interface:/app/interface
    ports:
      - "8000:8000"
    depends_on:
      nexus-redis:
        condition: service_healthy
    networks:
      - nexus-net
    environment:
      - REDIS_HOST=nexus-redis
      - REDIS_PORT=6379

  nexus-cerebro:
    build:
      context: ./interface/ui/cerebro
      dockerfile: Dockerfile
    container_name: nexus-cerebro
    ports:
      - "3000:80"
    depends_on:
      - nexus-core
    networks:
      - nexus-net
    environment:
      # Note: Vite uses load-time env vars, Nginx needs runtime replacement if dynamic
      - VITE_API_URL=http://localhost:8000

networks:
  nexus-net:
    driver: bridge

volumes:
  redis_data:
