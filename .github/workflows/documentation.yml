name: Documentation Consistency

on:
  push:
    branches: [NX-CG]
    paths:
      - ".env"
      - "README.md"
      - "CLAUDE.md"
      - "docs/**"
      - "scripts/doc_engine.py"
      - "core/**/*.py"
  pull_request:
    branches: [NX-CG]
    paths:
      - ".env"
      - "README.md"
      - "CLAUDE.md"
      - "docs/**"
      - "scripts/doc_engine.py"
      - "core/**/*.py"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply generated documentation updates"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-check:
    name: Check generated documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Regenerate documentation
        run: python scripts/doc_engine.py --full --apply
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Fail on documentation drift
        run: |
          git diff --exit-code README.md CLAUDE.md docs/ARCHITECTURE_MAP_GENERATED.md

      - name: Upload generated docs for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-generated
          path: |
            README.md
            CLAUDE.md
            docs/ARCHITECTURE_MAP_GENERATED.md
          retention-days: 14

  documentation-apply:
    name: Apply documentation updates
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.apply
    needs: [documentation-check]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Apply documentation sync
        run: python scripts/doc_engine.py --full --apply
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit updates if needed
        run: |
          if git diff --quiet README.md CLAUDE.md docs/ARCHITECTURE_MAP_GENERATED.md; then
            echo "No documentation updates to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md CLAUDE.md docs/ARCHITECTURE_MAP_GENERATED.md
          git commit -m "docs: synchronize generated documentation [skip ci]"
          git push
