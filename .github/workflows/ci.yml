# NEXUS V8.4 TRUE HIVE MIND - CI/CD Pipeline
#
# This workflow runs tests on push and pull requests.
# LLM tests are skipped via SKIP_LLM_TESTS=1 (no API credentials in CI).
#
# V8.0.2: Initial CI setup
# V8.4.4: Added N9AF branch support

name: NEXUS CI

on:
  push:
    branches: [N9AG, N9AF, N8THM, N7HM, main]
  pull_request:
    branches: [N9AG, N9AF, N8THM, N7HM, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    env:
      # Skip tests that require real LLM API calls
      SKIP_LLM_TESTS: 1
      # Disable telemetry during tests
      NEXUS_TELEMETRY: 0
      # Use test workspace
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create workspace directories
        run: |
          mkdir -p workspace/.nexus
          mkdir -p workspace/logs
          mkdir -p workspace/memory
          mkdir -p workspace/agents

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -x --ignore=tests/benchmark_professional.py
          # Explicitly run V9.0 E2E tests (Mocked LLM)
          python -m pytest tests/e2e/test_architect_negotiation.py -v
          python -m pytest tests/e2e/test_architect_spawning.py -v
          python -m pytest tests/e2e/test_spawn_execution.py -v
        timeout-minutes: 30

      - name: Run tests with coverage (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          pip install pytest-cov
          python -m pytest tests/ --cov=core --cov-report=xml --cov-report=term-missing --ignore=tests/benchmark_professional.py
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: |
          python -m py_compile nexus7.py
          find core -name "*.py" -exec python -m py_compile {} \;

  # Optional: Run full integration tests (manual trigger only)
  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        if: env.GEMINI_API_KEY != '' && env.ANTHROPIC_API_KEY != ''
        run: |
          python -m pytest tests/test_llm_context_isolation.py -v -s
        timeout-minutes: 60
